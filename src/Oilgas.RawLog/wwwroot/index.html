<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Oilgas RawLog</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 24px; color: #111; }
    h1 { font-size: 20px; }
    .meta { color: #6b7280; font-size: 13px; margin-bottom: 16px; }
    table { border-collapse: collapse; width: 100%; font-size: 13px; }
    th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid #eee; vertical-align: top; }
    th { color: #6b7280; font-weight: 600; }
    td.topic { white-space: nowrap; color: #0369a1; font-family: ui-monospace, monospace; }
    td.time { white-space: nowrap; color: #6b7280; }
    td.payload { font-family: ui-monospace, monospace; word-break: break-all; }
  </style>
</head>
<body>
  <h1>Oilgas — RawLog</h1>
  <div class="meta">Сирий потік із RabbitMQ (усе, що Hardware шле через Mosquitto). Останні <span id="count">0</span>.</div>
  <table>
    <thead><tr><th>Час (UTC)</th><th>Топік (routing key)</th><th>Повідомлення</th></tr></thead>
    <tbody id="rows"></tbody>
  </table>
  <script>
    async function refresh() {
      try {
        const items = await (await fetch('messages')).json();
        document.getElementById('count').textContent = items.length;
        document.getElementById('rows').innerHTML = items.map(i =>
          `<tr><td class="time">${new Date(i.at).toISOString().substr(11, 12)}</td>`
          + `<td class="topic">${i.topic}</td>`
          + `<td class="payload">${escapeHtml(i.payload)}</td></tr>`
        ).join('');
      } catch {}
    }
    function escapeHtml(s) { return s.replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }
    refresh(); setInterval(refresh, 1500);
  </script>
</body>
</html>
