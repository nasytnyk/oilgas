name: Power

# Кнопка «вимкнути / увімкнути» цілу RG (усі Container Apps).
#   stop   -> --min-replicas 0  (згортається до 0 реплік коли простоює -> компьют ~$0)
#   resume -> --min-replicas 1  (тримає 1 репліку постійно)
# (Підкоманд az containerapp stop/start немає у CLI на раннері, тому керуємо репліками.)
# Запуск: вкладка Actions -> Power -> Run workflow -> обрати action.
on:
  workflow_dispatch:
    inputs:
      action:
        description: "Що зробити з усіма Container Apps у RG"
        type: choice
        required: true
        default: stop
        options: [stop, resume]

permissions:
  id-token: write        # OIDC-логін у Azure
  contents: read

env:
  RG: oilgas-rg

jobs:
  power:
    runs-on: ubuntu-latest
    steps:
      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: ${{ inputs.action }} all Container Apps
        run: |
          az extension add --name containerapp --upgrade --only-show-errors || true
          MIN=${{ inputs.action == 'resume' && '1' || '0' }}

          APPS=$(az containerapp list -g "$RG" --query "[].name" -o tsv)
          if [ -z "$APPS" ]; then echo "У RG $RG немає Container Apps."; exit 0; fi

          for app in $APPS; do
            echo "::group::${{ inputs.action }} $app (min-replicas=$MIN)"
            az containerapp update -n "$app" -g "$RG" \
              --min-replicas "$MIN" --max-replicas 1 --only-show-errors -o none
            echo "$app -> min-replicas=$MIN OK"
            echo "::endgroup::"
          done

          echo "=== Підсумок ==="
          az containerapp list -g "$RG" \
            --query "[].{name:name, running:properties.runningStatus, minReplicas:properties.template.scale.minReplicas}" -o table
