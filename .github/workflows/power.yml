name: Power

# Кнопка «вимкнути / увімкнути» цілу RG (усі Container Apps) — СТРОГО.
#   stop   -> ARM-операція .../stop  (повна деалокація: 0 реплік, компьют $0, морда 404)
#   start  -> ARM-операція .../start (підняти назад до штатних реплік)
# Викликаємо ARM REST напряму через `az rest`, бо підкоманд `az containerapp stop/start`
# немає у версії CLI на раннері. Сам застосунок при цьому НЕ видаляється — лише глушиться.
# Запуск: вкладка Actions -> Power -> Run workflow -> обрати action.
on:
  workflow_dispatch:
    inputs:
      action:
        description: "Що зробити з усіма Container Apps у RG"
        type: choice
        required: true
        default: stop
        options: [stop, start]

permissions:
  id-token: write        # OIDC-логін у Azure
  contents: read

env:
  RG: oilgas-rg
  API_VERSION: "2024-03-01"

jobs:
  power:
    runs-on: ubuntu-latest
    steps:
      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: ${{ inputs.action }} all Container Apps
        run: |
          set -euo pipefail
          ACTION="${{ inputs.action }}"
          SUB=$(az account show --query id -o tsv)

          APPS=$(az containerapp list -g "$RG" --query "[].name" -o tsv)
          if [ -z "$APPS" ]; then echo "У RG $RG немає Container Apps."; exit 0; fi

          for app in $APPS; do
            echo "::group::$ACTION $app"
            az rest --method post \
              --url "https://management.azure.com/subscriptions/$SUB/resourceGroups/$RG/providers/Microsoft.App/containerApps/$app/$ACTION?api-version=$API_VERSION" \
              -o none
            echo "$app -> $ACTION OK"
            echo "::endgroup::"
          done

          echo "=== Підсумок ==="
          az containerapp list -g "$RG" \
            --query "[].{name:name, running:properties.runningStatus}" -o table
