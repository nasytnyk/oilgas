name: Deploy

# Повний CD під поточну ситуацію:
#   build Hardware + Mosquitto -> GHCR -> OIDC-логін -> деплой у Container Apps (oilgas-rg).
# Mosquitto — internal TCP-брокер; Hardware конектиться до нього ЗА ІМЕНЕМ (oilgas-mosquitto).
on:
  push:
    branches: [ main ]
    paths-ignore:        # зміни лише в доках/скриптах не тригерять деплой
      - '**.md'
      - 'scripts/**'
      - 'problems/**'
  workflow_dispatch:

permissions:
  id-token: write        # OIDC-логін у Azure
  contents: read
  packages: write        # пуш образів у GHCR

env:
  HW_IMAGE: ghcr.io/nasytnyk/oilgas-hardware
  MQ_IMAGE: ghcr.io/nasytnyk/oilgas-mosquitto
  WT_IMAGE: ghcr.io/nasytnyk/oilgas-workertier
  RL_IMAGE: ghcr.io/nasytnyk/oilgas-rawlog
  DW_IMAGE: ghcr.io/nasytnyk/oilgas-dbwriter
  WEB_IMAGE: ghcr.io/nasytnyk/oilgas-webtier
  RABBIT_IMAGE: rabbitmq:4-management-alpine
  RG: oilgas-rg
  ENV_NAME: oilgas-env
  RABBITMQ_PASSWORD: ${{ secrets.RABBITMQ_PASSWORD }}
  SQL_CONNECTION: ${{ secrets.SQL_CONNECTION }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Визначаємо, які сервіси змінились (їхні файли + спільні залежності).
      # workflow_dispatch або зміна самого workflow/solution -> деплой усього.
      - name: Detect changed services
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            all:
              - '.github/workflows/deploy.yml'
              - 'global.json'
              - 'Oilgas.slnx'
            hardware:
              - 'src/Oilgas.Hardware/**'
              - 'src/Oilgas.Contracts/**'
              - 'src/Oilgas.Measurements/**'
            mosquitto:
              - 'deploy/mosquitto/**'
            workertier:
              - 'src/Oilgas.WorkerTier/**'
            rawlog:
              - 'src/Oilgas.RawLog/**'
            dbwriter:
              - 'src/Oilgas.DbWriter/**'
              - 'src/Oilgas.Contracts/**'
              - 'src/Oilgas.Model/**'
              - 'src/Oilgas.Measurements/**'
              - 'src/Oilgas.UseCases/**'
              - 'src/Oilgas.SqlServer/**'
            webtier:
              - 'src/Oilgas.WebTier/**'
              - 'src/Oilgas.Contracts/**'
              - 'src/Oilgas.Model/**'
              - 'src/Oilgas.Measurements/**'
              - 'src/Oilgas.UseCases/**'
              - 'src/Oilgas.SqlServer/**'

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push Hardware
        if: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.all == 'true' || steps.filter.outputs.hardware == 'true' }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/Oilgas.Hardware/Dockerfile
          push: true
          tags: |
            ${{ env.HW_IMAGE }}:${{ github.sha }}
            ${{ env.HW_IMAGE }}:latest

      - name: Build & push Mosquitto
        if: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.all == 'true' || steps.filter.outputs.mosquitto == 'true' }}
        uses: docker/build-push-action@v6
        with:
          context: deploy/mosquitto
          file: deploy/mosquitto/Dockerfile
          push: true
          tags: |
            ${{ env.MQ_IMAGE }}:${{ github.sha }}
            ${{ env.MQ_IMAGE }}:latest

      - name: Build & push WorkerTier (bridge)
        if: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.all == 'true' || steps.filter.outputs.workertier == 'true' }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/Oilgas.WorkerTier/Dockerfile
          push: true
          tags: |
            ${{ env.WT_IMAGE }}:${{ github.sha }}
            ${{ env.WT_IMAGE }}:latest

      - name: Build & push RawLog
        if: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.all == 'true' || steps.filter.outputs.rawlog == 'true' }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/Oilgas.RawLog/Dockerfile
          push: true
          tags: |
            ${{ env.RL_IMAGE }}:${{ github.sha }}
            ${{ env.RL_IMAGE }}:latest

      - name: Build & push DbWriter
        if: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.all == 'true' || steps.filter.outputs.dbwriter == 'true' }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/Oilgas.DbWriter/Dockerfile
          push: true
          tags: |
            ${{ env.DW_IMAGE }}:${{ github.sha }}
            ${{ env.DW_IMAGE }}:latest

      - name: Build & push WebTier (GraphQL + console)
        if: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.all == 'true' || steps.filter.outputs.webtier == 'true' }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/Oilgas.WebTier/Dockerfile
          push: true
          tags: |
            ${{ env.WEB_IMAGE }}:${{ github.sha }}
            ${{ env.WEB_IMAGE }}:latest

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Prep az (containerapp extension)
        run: az extension add --name containerapp --upgrade --only-show-errors || true

      - name: Deploy Mosquitto (internal TCP broker)
        if: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.all == 'true' || steps.filter.outputs.mosquitto == 'true' }}
        run: |
          if az containerapp show -n oilgas-mosquitto -g "$RG" -o none 2>/dev/null; then
            az containerapp update -n oilgas-mosquitto -g "$RG" \
              --image "$MQ_IMAGE:$GITHUB_SHA" --only-show-errors -o none
          else
            az containerapp create -n oilgas-mosquitto -g "$RG" --environment "$ENV_NAME" \
              --image "$MQ_IMAGE:$GITHUB_SHA" \
              --ingress internal --transport tcp --target-port 1883 --exposed-port 1883 \
              --min-replicas 1 --max-replicas 1 --cpu 0.25 --memory 0.5Gi --only-show-errors -o none
          fi

      - name: Deploy Hardware (external web UI + simulator)
        if: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.all == 'true' || steps.filter.outputs.hardware == 'true' }}
        run: |
          if az containerapp show -n oilgas-hardware -g "$RG" -o none 2>/dev/null; then
            az containerapp update -n oilgas-hardware -g "$RG" \
              --image "$HW_IMAGE:$GITHUB_SHA" --only-show-errors -o none
          else
            # ВАЖЛИВО: BrokerHost = ІМ'Я застосунку Mosquitto (internal TCP доступний за іменем, не FQDN)
            az containerapp create -n oilgas-hardware -g "$RG" --environment "$ENV_NAME" \
              --image "$HW_IMAGE:$GITHUB_SHA" \
              --ingress external --target-port 8080 \
              --min-replicas 1 --max-replicas 1 --cpu 0.25 --memory 0.5Gi \
              --env-vars "Mqtt__Host=oilgas-mosquitto" "Mqtt__Port=1883" "Hardware__IntervalSeconds=5" \
              --only-show-errors -o none
          fi
          echo "Hardware URL: https://$(az containerapp show -n oilgas-hardware -g "$RG" --query properties.configuration.ingress.fqdn -o tsv)"

      - name: Deploy RabbitMQ (internal AMQP broker)
        if: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.all == 'true' }}
        run: |
          if [ -z "$RABBITMQ_PASSWORD" ]; then
            echo "::error::Секрет RABBITMQ_PASSWORD не заданий. Додай: gh secret set RABBITMQ_PASSWORD -R nasytnyk/oilgas"
            exit 1
          fi
          if az containerapp show -n oilgas-rabbitmq -g "$RG" -o none 2>/dev/null; then
            az containerapp update -n oilgas-rabbitmq -g "$RG" --image "$RABBIT_IMAGE" --only-show-errors -o none
          else
            az containerapp create -n oilgas-rabbitmq -g "$RG" --environment "$ENV_NAME" \
              --image "$RABBIT_IMAGE" \
              --ingress internal --transport tcp --target-port 5672 --exposed-port 5672 \
              --min-replicas 1 --max-replicas 1 --cpu 0.5 --memory 1.0Gi \
              --secrets "rabbit-pass=$RABBITMQ_PASSWORD" \
              --env-vars "RABBITMQ_DEFAULT_USER=oilgas" "RABBITMQ_DEFAULT_PASS=secretref:rabbit-pass" \
              --only-show-errors -o none
          fi

      - name: Deploy WorkerTier (Mosquitto -> RabbitMQ bridge)
        if: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.all == 'true' || steps.filter.outputs.workertier == 'true' }}
        run: |
          if az containerapp show -n oilgas-workertier -g "$RG" -o none 2>/dev/null; then
            az containerapp update -n oilgas-workertier -g "$RG" \
              --image "$WT_IMAGE:$GITHUB_SHA" --only-show-errors -o none
          else
            az containerapp create -n oilgas-workertier -g "$RG" --environment "$ENV_NAME" \
              --image "$WT_IMAGE:$GITHUB_SHA" \
              --min-replicas 1 --max-replicas 1 --cpu 0.25 --memory 0.5Gi \
              --secrets "rabbit-pass=$RABBITMQ_PASSWORD" \
              --env-vars "Mqtt__Host=oilgas-mosquitto" "Mqtt__Port=1883" \
                         "Rabbit__Host=oilgas-rabbitmq" "Rabbit__Port=5672" \
                         "Rabbit__User=oilgas" "Rabbit__Password=secretref:rabbit-pass" \
              --only-show-errors -o none
          fi

      - name: Deploy RawLog (external web UI, RabbitMQ consumer)
        if: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.all == 'true' || steps.filter.outputs.rawlog == 'true' }}
        run: |
          if az containerapp show -n oilgas-rawlog -g "$RG" -o none 2>/dev/null; then
            az containerapp update -n oilgas-rawlog -g "$RG" \
              --image "$RL_IMAGE:$GITHUB_SHA" --only-show-errors -o none
          else
            az containerapp create -n oilgas-rawlog -g "$RG" --environment "$ENV_NAME" \
              --image "$RL_IMAGE:$GITHUB_SHA" \
              --ingress external --target-port 8080 \
              --min-replicas 1 --max-replicas 1 --cpu 0.25 --memory 0.5Gi \
              --secrets "rabbit-pass=$RABBITMQ_PASSWORD" \
              --env-vars "Rabbit__Host=oilgas-rabbitmq" "Rabbit__Port=5672" \
                         "Rabbit__User=oilgas" "Rabbit__Password=secretref:rabbit-pass" \
              --only-show-errors -o none
          fi
          echo "RawLog URL: https://$(az containerapp show -n oilgas-rawlog -g "$RG" --query properties.configuration.ingress.fqdn -o tsv)"

      - name: Deploy DbWriter (RabbitMQ -> Azure SQL microservice)
        if: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.all == 'true' || steps.filter.outputs.dbwriter == 'true' }}
        run: |
          if [ -z "$SQL_CONNECTION" ]; then
            echo "::warning::Секрет SQL_CONNECTION не заданий — пропускаю DbWriter. Додай: gh secret set SQL_CONNECTION -R nasytnyk/oilgas"
            exit 0
          fi
          if az containerapp show -n oilgas-dbwriter -g "$RG" -o none 2>/dev/null; then
            az containerapp update -n oilgas-dbwriter -g "$RG" \
              --image "$DW_IMAGE:$GITHUB_SHA" --only-show-errors -o none
          else
            az containerapp create -n oilgas-dbwriter -g "$RG" --environment "$ENV_NAME" \
              --image "$DW_IMAGE:$GITHUB_SHA" \
              --min-replicas 1 --max-replicas 1 --cpu 0.25 --memory 0.5Gi \
              --secrets "rabbit-pass=$RABBITMQ_PASSWORD" "sql-conn=$SQL_CONNECTION" \
              --env-vars "Rabbit__Host=oilgas-rabbitmq" "Rabbit__Port=5672" \
                         "Rabbit__User=oilgas" "Rabbit__Password=secretref:rabbit-pass" \
                         "ConnectionStrings__Sql=secretref:sql-conn" \
              --only-show-errors -o none
          fi

      - name: Deploy WebTier (GraphQL API + engineering console)
        if: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.all == 'true' || steps.filter.outputs.webtier == 'true' }}
        run: |
          if [ -z "$SQL_CONNECTION" ]; then
            echo "::warning::SQL_CONNECTION не заданий — пропускаю WebTier (потрібна БД для queries)."
            exit 0
          fi
          if az containerapp show -n oilgas-webtier -g "$RG" -o none 2>/dev/null; then
            az containerapp update -n oilgas-webtier -g "$RG" \
              --image "$WEB_IMAGE:$GITHUB_SHA" --only-show-errors -o none
          else
            az containerapp create -n oilgas-webtier -g "$RG" --environment "$ENV_NAME" \
              --image "$WEB_IMAGE:$GITHUB_SHA" \
              --ingress external --target-port 8080 \
              --min-replicas 1 --max-replicas 1 --cpu 0.25 --memory 0.5Gi \
              --secrets "rabbit-pass=$RABBITMQ_PASSWORD" "sql-conn=$SQL_CONNECTION" \
              --env-vars "Rabbit__Host=oilgas-rabbitmq" "Rabbit__Port=5672" \
                         "Rabbit__User=oilgas" "Rabbit__Password=secretref:rabbit-pass" \
                         "ConnectionStrings__Sql=secretref:sql-conn" \
                         "Hardware__BaseUrl=http://oilgas-hardware" \
              --only-show-errors -o none
          fi
          echo "Console URL: https://$(az containerapp show -n oilgas-webtier -g "$RG" --query properties.configuration.ingress.fqdn -o tsv)"
