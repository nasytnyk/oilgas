name: Deploy

# Пер-сервісний CD у Azure Container Apps (oilgas-rg).
# Змінився лише один сервіс -> редеплоїться лише він; спільний Oilgas.Model або сам
# workflow/slnx -> редеплой усього. Зміни в доках/скриптах деплой не тригерять.
on:
  push:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - 'scripts/**'
      - 'problems/**'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read
  packages: write

env:
  HW_IMAGE: ghcr.io/nasytnyk/oilgas-hardware
  MQ_IMAGE: ghcr.io/nasytnyk/oilgas-mosquitto
  BRIDGE_IMAGE: ghcr.io/nasytnyk/oilgas-mqtt-to-rmq
  DB_IMAGE: ghcr.io/nasytnyk/oilgas-rmq-to-db
  UI_IMAGE: ghcr.io/nasytnyk/oilgas-ui
  RABBIT_IMAGE: rabbitmq:4-management-alpine
  RG: oilgas-rg
  ENV_NAME: oilgas-env
  RABBITMQ_PASSWORD: ${{ secrets.RABBITMQ_PASSWORD }}
  SQL_CONNECTION: ${{ secrets.SQL_CONNECTION }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Detect changed services
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            all:
              - '.github/workflows/deploy.yml'
              - 'global.json'
              - 'Oilgas.slnx'
            hardware:
              - 'src/Oilgas.Hardware/**'
              - 'src/Oilgas.Model/**'
            mosquitto:
              - 'deploy/mosquitto/**'
            bridge:
              - 'src/Oilgas.MqttToRmq/**'
            db:
              - 'src/Oilgas.RmqToDb/**'
              - 'src/Oilgas.Model/**'
              - 'src/Oilgas.Ef/**'
            ui:
              - 'src/Oilgas.Ui/**'
              - 'src/Oilgas.Model/**'
              - 'src/Oilgas.Ef/**'

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push Hardware
        if: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.all == 'true' || steps.filter.outputs.hardware == 'true' }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/Oilgas.Hardware/Dockerfile
          push: true
          tags: |
            ${{ env.HW_IMAGE }}:${{ github.sha }}
            ${{ env.HW_IMAGE }}:latest

      - name: Build & push Mosquitto
        if: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.all == 'true' || steps.filter.outputs.mosquitto == 'true' }}
        uses: docker/build-push-action@v6
        with:
          context: deploy/mosquitto
          file: deploy/mosquitto/Dockerfile
          push: true
          tags: |
            ${{ env.MQ_IMAGE }}:${{ github.sha }}
            ${{ env.MQ_IMAGE }}:latest

      - name: Build & push MqttToRmq (bridge)
        if: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.all == 'true' || steps.filter.outputs.bridge == 'true' }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/Oilgas.MqttToRmq/Dockerfile
          push: true
          tags: |
            ${{ env.BRIDGE_IMAGE }}:${{ github.sha }}
            ${{ env.BRIDGE_IMAGE }}:latest

      - name: Build & push RmqToDb
        if: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.all == 'true' || steps.filter.outputs.db == 'true' }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/Oilgas.RmqToDb/Dockerfile
          push: true
          tags: |
            ${{ env.DB_IMAGE }}:${{ github.sha }}
            ${{ env.DB_IMAGE }}:latest

      - name: Build & push Ui (GraphQL + console)
        if: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.all == 'true' || steps.filter.outputs.ui == 'true' }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/Oilgas.Ui/Dockerfile
          push: true
          tags: |
            ${{ env.UI_IMAGE }}:${{ github.sha }}
            ${{ env.UI_IMAGE }}:latest

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Prep az (containerapp extension)
        run: az extension add --name containerapp --upgrade --only-show-errors || true

      - name: Deploy Mosquitto (internal TCP broker)
        if: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.all == 'true' || steps.filter.outputs.mosquitto == 'true' }}
        run: |
          if az containerapp show -n oilgas-mosquitto -g "$RG" -o none 2>/dev/null; then
            az containerapp update -n oilgas-mosquitto -g "$RG" \
              --image "$MQ_IMAGE:$GITHUB_SHA" --only-show-errors -o none
          else
            az containerapp create -n oilgas-mosquitto -g "$RG" --environment "$ENV_NAME" \
              --image "$MQ_IMAGE:$GITHUB_SHA" \
              --ingress internal --transport tcp --target-port 1883 --exposed-port 1883 \
              --min-replicas 1 --max-replicas 1 --cpu 0.25 --memory 0.5Gi --only-show-errors -o none
          fi

      - name: Deploy Hardware (internal simulator + control API)
        if: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.all == 'true' || steps.filter.outputs.hardware == 'true' }}
        run: |
          # Hardware без морди: internal ingress, лише /start /stop для Ui (за іменем oilgas-hardware)
          if az containerapp show -n oilgas-hardware -g "$RG" -o none 2>/dev/null; then
            az containerapp update -n oilgas-hardware -g "$RG" \
              --image "$HW_IMAGE:$GITHUB_SHA" --only-show-errors -o none
          else
            az containerapp create -n oilgas-hardware -g "$RG" --environment "$ENV_NAME" \
              --image "$HW_IMAGE:$GITHUB_SHA" \
              --ingress internal --target-port 8080 \
              --min-replicas 1 --max-replicas 1 --cpu 0.25 --memory 0.5Gi \
              --env-vars "Mqtt__Host=oilgas-mosquitto" "Mqtt__Port=1883" "Hardware__IntervalSeconds=5" \
              --only-show-errors -o none
          fi

      - name: Deploy RabbitMQ (internal AMQP broker)
        if: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.all == 'true' }}
        run: |
          if [ -z "$RABBITMQ_PASSWORD" ]; then
            echo "::error::Секрет RABBITMQ_PASSWORD не заданий. Додай: gh secret set RABBITMQ_PASSWORD -R nasytnyk/oilgas"
            exit 1
          fi
          if az containerapp show -n oilgas-rabbitmq -g "$RG" -o none 2>/dev/null; then
            az containerapp update -n oilgas-rabbitmq -g "$RG" --image "$RABBIT_IMAGE" --only-show-errors -o none
          else
            az containerapp create -n oilgas-rabbitmq -g "$RG" --environment "$ENV_NAME" \
              --image "$RABBIT_IMAGE" \
              --ingress internal --transport tcp --target-port 5672 --exposed-port 5672 \
              --min-replicas 1 --max-replicas 1 --cpu 0.5 --memory 1.0Gi \
              --secrets "rabbit-pass=$RABBITMQ_PASSWORD" \
              --env-vars "RABBITMQ_DEFAULT_USER=oilgas" "RABBITMQ_DEFAULT_PASS=secretref:rabbit-pass" \
              --only-show-errors -o none
          fi

      - name: Deploy MqttToRmq (Mosquitto -> RabbitMQ bridge)
        if: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.all == 'true' || steps.filter.outputs.bridge == 'true' }}
        run: |
          if az containerapp show -n oilgas-mqtt-to-rmq -g "$RG" -o none 2>/dev/null; then
            az containerapp update -n oilgas-mqtt-to-rmq -g "$RG" \
              --image "$BRIDGE_IMAGE:$GITHUB_SHA" --only-show-errors -o none
          else
            az containerapp create -n oilgas-mqtt-to-rmq -g "$RG" --environment "$ENV_NAME" \
              --image "$BRIDGE_IMAGE:$GITHUB_SHA" \
              --min-replicas 1 --max-replicas 1 --cpu 0.25 --memory 0.5Gi \
              --secrets "rabbit-pass=$RABBITMQ_PASSWORD" \
              --env-vars "Mqtt__Host=oilgas-mosquitto" "Mqtt__Port=1883" \
                         "Rabbit__Host=oilgas-rabbitmq" "Rabbit__Port=5672" \
                         "Rabbit__User=oilgas" "Rabbit__Password=secretref:rabbit-pass" \
              --only-show-errors -o none
          fi

      - name: Deploy RmqToDb (RabbitMQ -> Azure SQL microservice)
        if: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.all == 'true' || steps.filter.outputs.db == 'true' }}
        run: |
          if [ -z "$SQL_CONNECTION" ]; then
            echo "::warning::SQL_CONNECTION не заданий — пропускаю RmqToDb. Додай: gh secret set SQL_CONNECTION -R nasytnyk/oilgas"
            exit 0
          fi
          if az containerapp show -n oilgas-rmq-to-db -g "$RG" -o none 2>/dev/null; then
            az containerapp update -n oilgas-rmq-to-db -g "$RG" \
              --image "$DB_IMAGE:$GITHUB_SHA" --only-show-errors -o none
          else
            az containerapp create -n oilgas-rmq-to-db -g "$RG" --environment "$ENV_NAME" \
              --image "$DB_IMAGE:$GITHUB_SHA" \
              --min-replicas 1 --max-replicas 1 --cpu 0.25 --memory 0.5Gi \
              --secrets "rabbit-pass=$RABBITMQ_PASSWORD" "sql-conn=$SQL_CONNECTION" \
              --env-vars "Rabbit__Host=oilgas-rabbitmq" "Rabbit__Port=5672" \
                         "Rabbit__User=oilgas" "Rabbit__Password=secretref:rabbit-pass" \
                         "ConnectionStrings__Sql=secretref:sql-conn" \
              --only-show-errors -o none
          fi

      - name: Deploy Ui (GraphQL API + engineering console)
        if: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.all == 'true' || steps.filter.outputs.ui == 'true' }}
        run: |
          if [ -z "$SQL_CONNECTION" ]; then
            echo "::warning::SQL_CONNECTION не заданий — пропускаю Ui (потрібна БД для queries)."
            exit 0
          fi
          if az containerapp show -n oilgas-ui -g "$RG" -o none 2>/dev/null; then
            az containerapp update -n oilgas-ui -g "$RG" \
              --image "$UI_IMAGE:$GITHUB_SHA" --only-show-errors -o none
          else
            az containerapp create -n oilgas-ui -g "$RG" --environment "$ENV_NAME" \
              --image "$UI_IMAGE:$GITHUB_SHA" \
              --ingress external --target-port 8080 \
              --min-replicas 1 --max-replicas 1 --cpu 0.25 --memory 0.5Gi \
              --secrets "rabbit-pass=$RABBITMQ_PASSWORD" "sql-conn=$SQL_CONNECTION" \
              --env-vars "Rabbit__Host=oilgas-rabbitmq" "Rabbit__Port=5672" \
                         "Rabbit__User=oilgas" "Rabbit__Password=secretref:rabbit-pass" \
                         "ConnectionStrings__Sql=secretref:sql-conn" \
                         "Hardware__BaseUrl=http://oilgas-hardware" \
              --only-show-errors -o none
          fi
          echo "Console URL: https://$(az containerapp show -n oilgas-ui -g "$RG" --query properties.configuration.ingress.fqdn -o tsv)"
