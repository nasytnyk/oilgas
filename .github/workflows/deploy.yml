name: Build images

# Збирає й пушить образи Hardware + Mosquitto у GHCR на кожен push у main.
# Деплой у Container Apps робимо через az (після того як пакети зроблено public).
on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push Hardware
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/Oilgas.Hardware/Dockerfile
          push: true
          tags: |
            ghcr.io/nasytnyk/oilgas-hardware:${{ github.sha }}
            ghcr.io/nasytnyk/oilgas-hardware:latest

      - name: Build & push Mosquitto
        uses: docker/build-push-action@v6
        with:
          context: deploy/mosquitto
          file: deploy/mosquitto/Dockerfile
          push: true
          tags: |
            ghcr.io/nasytnyk/oilgas-mosquitto:${{ github.sha }}
            ghcr.io/nasytnyk/oilgas-mosquitto:latest
