name: Deploy WebTier

# Повний CD: на push у main збирає образ, пушить у GHCR і оновлює Container App.
on:
  push:
    branches: [ main ]
    paths:
      - 'src/**'
      - 'global.json'
      - 'src/Oleumetry.WebTier/Dockerfile'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  id-token: write           # OIDC-логін у Azure (без паролів)
  contents: read
  packages: write           # пуш образу в GHCR

env:
  IMAGE: ghcr.io/nasytnyk/oleumetry-webtier

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/Oleumetry.WebTier/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to Container Apps
        run: |
          az extension add --name containerapp --upgrade --only-show-errors || true
          if az containerapp show -n oleumetry-webtier -g oleumetry-rg -o none 2>/dev/null; then
            az containerapp update -n oleumetry-webtier -g oleumetry-rg \
              --image "$IMAGE:$GITHUB_SHA" --only-show-errors -o none
          else
            az containerapp create -n oleumetry-webtier -g oleumetry-rg \
              --environment oleumetry-env \
              --image "$IMAGE:$GITHUB_SHA" \
              --ingress external --target-port 8080 --only-show-errors -o none
          fi
          echo "Deployed $IMAGE:$GITHUB_SHA"
