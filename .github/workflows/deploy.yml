name: Deploy

# Повний CD під поточну ситуацію:
#   build Hardware + Mosquitto -> GHCR -> OIDC-логін -> деплой у Container Apps (oilgas-rg).
# Mosquitto — internal TCP-брокер; Hardware конектиться до нього ЗА ІМЕНЕМ (oilgas-mosquitto).
on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  id-token: write        # OIDC-логін у Azure
  contents: read
  packages: write        # пуш образів у GHCR

env:
  HW_IMAGE: ghcr.io/nasytnyk/oilgas-hardware
  MQ_IMAGE: ghcr.io/nasytnyk/oilgas-mosquitto
  RG: oilgas-rg
  ENV_NAME: oilgas-env

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push Hardware
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/Oilgas.Hardware/Dockerfile
          push: true
          tags: |
            ${{ env.HW_IMAGE }}:${{ github.sha }}
            ${{ env.HW_IMAGE }}:latest

      - name: Build & push Mosquitto
        uses: docker/build-push-action@v6
        with:
          context: deploy/mosquitto
          file: deploy/mosquitto/Dockerfile
          push: true
          tags: |
            ${{ env.MQ_IMAGE }}:${{ github.sha }}
            ${{ env.MQ_IMAGE }}:latest

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy Mosquitto (internal TCP broker)
        run: |
          az extension add --name containerapp --upgrade --only-show-errors || true
          if az containerapp show -n oilgas-mosquitto -g "$RG" -o none 2>/dev/null; then
            az containerapp update -n oilgas-mosquitto -g "$RG" \
              --image "$MQ_IMAGE:$GITHUB_SHA" --only-show-errors -o none
          else
            az containerapp create -n oilgas-mosquitto -g "$RG" --environment "$ENV_NAME" \
              --image "$MQ_IMAGE:$GITHUB_SHA" \
              --ingress internal --transport tcp --target-port 1883 --exposed-port 1883 \
              --min-replicas 1 --max-replicas 1 --cpu 0.25 --memory 0.5Gi --only-show-errors -o none
          fi

      - name: Deploy Hardware (external web UI + simulator)
        run: |
          if az containerapp show -n oilgas-hardware -g "$RG" -o none 2>/dev/null; then
            az containerapp update -n oilgas-hardware -g "$RG" \
              --image "$HW_IMAGE:$GITHUB_SHA" --only-show-errors -o none
          else
            # ВАЖЛИВО: BrokerHost = ІМ'Я застосунку Mosquitto (internal TCP доступний за іменем, не FQDN)
            az containerapp create -n oilgas-hardware -g "$RG" --environment "$ENV_NAME" \
              --image "$HW_IMAGE:$GITHUB_SHA" \
              --ingress external --target-port 8080 \
              --min-replicas 1 --max-replicas 1 --cpu 0.25 --memory 0.5Gi \
              --env-vars "Mqtt__Host=oilgas-mosquitto" "Mqtt__Port=1883" "Hardware__IntervalSeconds=5" \
              --only-show-errors -o none
          fi
          echo "Hardware URL: https://$(az containerapp show -n oilgas-hardware -g "$RG" --query properties.configuration.ingress.fqdn -o tsv)"
