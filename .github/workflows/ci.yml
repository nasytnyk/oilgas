name: CI

# Збірка на кожен push у main і на кожен pull request у main.
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json   # ставить SDK згідно з global.json

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      # Тести додамо сюди, коли з'являться тестові проекти:
      # - name: Test
      #   run: dotnet test --no-build --configuration Release
