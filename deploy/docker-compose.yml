# Локальна інфраструктура Oleumetry.
# Піднімає 4 зовнішні системи, до яких підключаються адаптери (.NET-хости запускаються окремо через `dotnet run`).
# Запуск:   docker compose -f deploy/docker-compose.yml up -d
# Зупинка:  docker compose -f deploy/docker-compose.yml down        (додай -v щоб стерти й дані)

name: oleumetry

services:
  # ── PostgreSQL: сховище телеметрії (адаптер Oleumetry.Postgres) ──
  postgres:
    image: postgres:17-alpine
    container_name: oleumetry-postgres
    environment:
      POSTGRES_USER: oleumetry
      POSTGRES_PASSWORD: oleumetry      # лише для локалу; у хмарі — з секретів/env (parity)
      POSTGRES_DB: oleumetry
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data   # дані переживають рестарт контейнера
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oleumetry -d oleumetry"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── RabbitMQ: внутрішня шина (адаптер Oleumetry.RabbitMq) ──
  rabbitmq:
    image: rabbitmq:4-management-alpine   # варіант '-management' дає web-UI і Management API
    container_name: oleumetry-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: oleumetry
      RABBITMQ_DEFAULT_PASS: oleumetry
    ports:
      - "5672:5672"      # AMQP — сюди конектиться RabbitMQ.Client
      - "15672:15672"    # Management UI + HTTP API (метрики черг для дашборда)
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── EMQX: MQTT-брокер (адаптер Oleumetry.Emqx) ──
  emqx:
    image: emqx:5
    container_name: oleumetry-emqx
    environment:
      EMQX_DASHBOARD__DEFAULT_PASSWORD: oleumetry   # логін дашборда: admin / oleumetry
    ports:
      - "1883:1883"      # MQTT — сюди публікує Devices і підписується WorkerTier
      - "8083:8083"      # MQTT over WebSocket
      - "18083:18083"    # Dashboard + status API
    volumes:
      - emqx-data:/opt/emqx/data
    healthcheck:
      test: ["CMD", "emqx", "ctl", "status"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis: backplane для GraphQL-підписок (адаптер Oleumetry.Redis) ──
  redis:
    image: redis:7-alpine
    container_name: oleumetry-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

# Іменовані volume'и: керуються Docker'ом, дані живуть окремо від контейнерів.
volumes:
  postgres-data:
  rabbitmq-data:
  emqx-data:
  redis-data:
