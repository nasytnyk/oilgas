# Локальна інфраструктура Oilgas.
# Піднімає 4 зовнішні системи, до яких підключаються адаптери (.NET-хости запускаються окремо через `dotnet run`).
# Запуск:   docker compose -f deploy/docker-compose.yml up -d
# Зупинка:  docker compose -f deploy/docker-compose.yml down        (додай -v щоб стерти й дані)

name: oilgas

services:
  # ── PostgreSQL: сховище телеметрії (адаптер Oilgas.Postgres) ──
  postgres:
    image: postgres:17-alpine
    container_name: oilgas-postgres
    environment:
      POSTGRES_USER: oilgas
      POSTGRES_PASSWORD: oilgas      # лише для локалу; у хмарі — з секретів/env (parity)
      POSTGRES_DB: oilgas
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data   # дані переживають рестарт контейнера
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oilgas -d oilgas"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── RabbitMQ: внутрішня шина (адаптер Oilgas.RabbitMq) ──
  rabbitmq:
    image: rabbitmq:4-management-alpine   # варіант '-management' дає web-UI і Management API
    container_name: oilgas-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: oilgas
      RABBITMQ_DEFAULT_PASS: oilgas
    ports:
      - "5672:5672"      # AMQP — сюди конектиться RabbitMQ.Client
      - "15672:15672"    # Management UI + HTTP API (метрики черг для дашборда)
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Mosquitto: MQTT-брокер (той самий образ, що в Azure Container Apps) ──
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: oilgas-mosquitto
    ports:
      - "1883:1883"      # MQTT — сюди публікує Hardware і підписується WorkerTier
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto-data:/mosquitto/data

  # ── Redis: backplane для GraphQL-підписок (адаптер Oilgas.Redis) ──
  redis:
    image: redis:7-alpine
    container_name: oilgas-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

# Іменовані volume'и: керуються Docker'ом, дані живуть окремо від контейнерів.
volumes:
  postgres-data:
  rabbitmq-data:
  mosquitto-data:
  redis-data:
